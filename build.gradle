plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 't3craft'
}

sourceSets {
	// Plain-JVM smoke test for the T3 client; runs against a live server without Minecraft.
	smoke {
		java.srcDir 'src/smoke/java'
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

// Self-tests, world tests, captures and demo recordings run without a window unless -Pshow=true; -Phidden=true hides an ordinary runClient too.
def hiddenRun() {
	project.findProperty('show') != 'true' && (project.findProperty('hidden') == 'true' || ['selftest', 'worldtest', 'webShowcase', 'demo'].any { project.hasProperty(it) })
}

loom {
	runs {
		server {
			// -PserverDir=<dir> runs a second local world with its own server.properties and port.
			runDir (project.findProperty('serverDir') ?: 'run-server')
			if (project.hasProperty('launcherId')) vmArg "-Dt3craft.launcherId=${project.property('launcherId')}"
		}
		client {
			// Fixed offline name so the local server's ops.json keeps you opped (-Pusername=<name>).
			programArgs "--username", (project.findProperty('username') ?: 'Player')
			// ./gradlew runClient -Pjoin=localhost:25565 goes straight into a server (used by the Mac launcher).
			if (project.hasProperty('join') && !project.hasProperty('selftest')) {
				programArgs "--quickPlayMultiplayer", project.property('join')
			}
			// ./gradlew runClient -PwebShowcase=<threadId> captures the real T3 laptop and agent card at 2000x1250 (read-only).
			if (project.hasProperty('webShowcase')) {
				vmArg "-Dt3craft.webShowcase=${project.property('webShowcase')}"
				if (project.hasProperty('webPing')) vmArg "-Dt3craft.webPing=${project.property('webPing')}"
				if (project.hasProperty('webPair')) vmArg "-Dt3craft.webPair=${project.property('webPair')}"
				programArgs "--width", "1000", "--height", "625"
			}
			// ./gradlew runClient -Pselftest="<prompt>" joins the local runServer and drives the panel.
			if (project.hasProperty('selftest')) {
				vmArg "-Dt3craft.selftest=${project.property('selftest')}"
				// -Pwidth=1000 -Pheight=625 captures at a fixed window size (2000 × 1250 on a Retina Mac).
				if (project.hasProperty('width') && project.hasProperty('height')) programArgs "--width", project.property('width'), "--height", project.property('height')
				if (project.hasProperty('config')) vmArg "-Dt3craft.config=${project.property('config')}"
				if (project.hasProperty('expectedDesk')) vmArg "-Dt3craft.expectedDesk=${project.property('expectedDesk')}"
				if (project.hasProperty('focus')) vmArg "-Dt3craft.focus=${project.property('focus')}"
				if (project.hasProperty('fixturePort')) vmArg "-Dt3craft.fixturePort=${project.property('fixturePort')}"
				if(project.hasProperty("world")) programArgs "--quickPlaySingleplayer", project.property("world")
				else programArgs "--quickPlayMultiplayer", (project.findProperty('join') ?: 'localhost:25565')
			}
			// ./gradlew runClient -Pworldtest=<place> [-Pconfig=<pairing file>] walks title screen → New T3 World → Create and screenshots the arrival and desks.
			if (project.hasProperty('worldtest')) {
				vmArg "-Dt3craft.worldtest=${project.property('worldtest')}"
				// -Pworldtalk=<seconds> then waits for a real conversation (a thread spawning a subagent); -Pworldtalk=stage starts one.
				if (project.hasProperty('worldtalk')) vmArg "-Dt3craft.worldtalk=${project.property('worldtalk')}"
				// -Pworldlife photographs the characters in short frame sequences (typing, glancing up, name tags, idles).
				if (project.hasProperty('worldlife')) vmArg "-Dt3craft.worldlife=true"
				if (project.hasProperty('config')) vmArg "-Dt3craft.config=${project.property('config')}"
			}
			// ./gradlew runClient -Pdemo=<output dir> -Pconfig=<pairing file> records the launch video shots (scripts/demo/record.sh runs it).
			if (project.hasProperty('demo')) {
				vmArg "-Dt3craft.demo=${project.property('demo')}"
				if (project.hasProperty('demoPlace')) vmArg "-Dt3craft.demoPlace=${project.property('demoPlace')}"
				if (project.hasProperty('demoFfmpeg')) vmArg "-Dt3craft.demoFfmpeg=${project.property('demoFfmpeg')}"
				// -PdemoShots=card,ship records only those shots; -PdemoSeed=<n> varies the hand (the human input model's random choices).
				if (project.hasProperty('demoShots')) vmArg "-Dt3craft.demoShots=${project.property('demoShots')}"
				if (project.hasProperty('demoSeed')) vmArg "-Dt3craft.demoSeed=${project.property('demoSeed')}"
				if (project.hasProperty('config')) vmArg "-Dt3craft.config=${project.property('config')}"
				if (project.hasProperty('fixturePort')) vmArg "-Dt3craft.fixturePort=${project.property('fixturePort')}"
				if (project.hasProperty('width') && project.hasProperty('height')) programArgs "--width", project.property('width'), "--height", project.property('height')
			}
			// -PmcpPort=<port> keeps a dev client's Minecraft MCP server off the port your real game uses (25590).
			if (project.hasProperty('mcpPort')) vmArg "-Dt3craft.mcpPort=${project.property('mcpPort')}"
			// Automated runs never show a window or take focus (docs/AGENTS-GUIDE.md): -Pshow=true to watch one, -Phidden=true hides any run.
			if (hiddenRun()) vmArg "-Dt3craft.hidden=true"
			// -PclientDir=<dir> gives a run its own game directory (scripts/mc uses run-harness/); -PnoPair=true never looks for the local T3.
			if (project.hasProperty('clientDir')) runDir project.property('clientDir')
			if (project.findProperty('noPair') == 'true') vmArg "-Dt3craft.noAutoConnect=true"
			if (project.hasProperty('harness')) vmArg "-Dt3craft.harness=${project.property('harness')}"
			if (!project.hasProperty('selftest') && !project.hasProperty('join') && project.hasProperty('world')) programArgs "--quickPlaySingleplayer", project.property('world')
			if (!project.hasProperty('selftest') && !project.hasProperty('webShowcase') && !project.hasProperty('demo') && project.hasProperty('width') && project.hasProperty('height')) programArgs "--width", project.property('width'), "--height", project.property('height')
		}
	}

	mods {
		"t3craft" {
			sourceSet sourceSets.main
		}
	}
}

// Fabric client game tests (src/gametest): ./gradlew runClientGameTest starts a real client, drives it and saves
// screenshots to build/run/clientGameTest/screenshots. Hidden like the self-tests; never pairs with a real T3.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 't3craft-gametest'
		enableGameTests = false
		enableClientGameTests = true
	}
}

loom.runs.named('clientGameTest') {
	if (project.findProperty('show') != 'true') vmArg "-Dt3craft.hidden=true"
	// Off the real game's 25590, like scripts/mc.
	vmArg "-Dt3craft.mcpPort=${project.findProperty('mcpPort') ?: '25690'}"
}

// The local launcher owns this invocation's stdin and sends a graceful `stop` on exit.
tasks.named('runServer', JavaExec) { standardInput = System.in }

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(25)
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Fixture-backed checks: -PfixturePort wins, then T3CRAFT_FIXTURE_PORT (what verify-ci.sh allocates), then the old default.
def fixturePort() { project.findProperty('fixturePort') ?: System.getenv('T3CRAFT_FIXTURE_PORT') ?: '25680' }

tasks.register('smoke', JavaExec) {
	description = 'Pair, dispatch, and poll against a live T3 server: -Pt3url=<pairing url>'
	classpath = sourceSets.smoke.runtimeClasspath
	mainClass = 'dev.maxwellyoung.t3craft.Smoke'
	args = [project.findProperty('t3url') ?: '', project.findProperty('t3prompt') ?: '']
	systemProperty 't3.newThread', project.findProperty('t3new') ?: 'false'
}

tasks.register('featureCheck', JavaExec) {
	description = 'Decision routing and checkpoint review against scripts/feature-fixture.py (loopback only).'
	classpath = sourceSets.smoke.runtimeClasspath
	mainClass = 'dev.maxwellyoung.t3craft.FeatureChecks'
	args = [fixturePort()]
}

tasks.register('reliabilityCheck', JavaExec) {
	description = 'MCP request boundary and connection recovery against the isolated T3 fixture.'
	classpath = sourceSets.smoke.runtimeClasspath
	mainClass = 'dev.maxwellyoung.t3craft.ReliabilityChecks'
	args = [fixturePort()]
}

tasks.register('reviewProbe', JavaExec) {
	description = 'Read-only diff compatibility check using an existing pairing file; no content is printed.'
	classpath = sourceSets.smoke.runtimeClasspath
	mainClass = 'dev.maxwellyoung.t3craft.ReviewProbe'
	args = [project.findProperty('config') ?: 'run/config/t3craft.json']
}

tasks.register('liveCheck', JavaExec) {
	description = 'Opt-in real-agent check in an explicitly supplied disposable project: -Pconfig=<pairing file> -PqaProject=<descriptor>.'
	classpath = sourceSets.smoke.runtimeClasspath
	mainClass = 'dev.maxwellyoung.t3craft.LiveChecks'
	args = [project.findProperty('config') ?: 'run/config/t3craft.json', project.findProperty('qaProject') ?: '']
}

tasks.register('officeCheck', JavaExec) {
	description = 'Stable spatial identity, pin priority, persistence and owner isolation with synthetic data.'
	classpath = sourceSets.smoke.runtimeClasspath
	mainClass = 'dev.maxwellyoung.t3craft.OfficeChecks'
}

tasks.register('usageBoardCheck', JavaExec) {
	description = 'Parses sanitized T3 and Muse usage fixtures for the office board.'
	classpath = sourceSets.smoke.runtimeClasspath
	mainClass = 'dev.maxwellyoung.t3craft.UsageBoardChecks'
}

tasks.register('connectionCheck', JavaExec) {
	description = 'Private pairing errors, per-machine changes and cached peer continuity against loopback fixtures.'
	classpath = sourceSets.smoke.runtimeClasspath
	mainClass = 'dev.maxwellyoung.t3craft.ConnectionChecks'
	args = [fixturePort()]
}

tasks.register('worldCheck', JavaExec) {
	description = 'T3 World seed list, save marker and office/spawn placement math without starting Minecraft.'
	classpath = sourceSets.smoke.runtimeClasspath
	mainClass = 'dev.maxwellyoung.t3craft.WorldChecks'
}

tasks.register('uiCheck', JavaExec) {
	description = 'Pure UI logic (diff headers, table cells, ellipsize) without starting Minecraft.'
	classpath = sourceSets.smoke.runtimeClasspath
	mainClass = 'dev.maxwellyoung.t3craft.UiChecks'
}

tasks.register('talkCheck', JavaExec) {
	description = 'Agents talking in person: conversations from synthetic snapshots, walks on open cells in all four office turns, rate limits.'
	classpath = sourceSets.smoke.runtimeClasspath
	mainClass = 'dev.maxwellyoung.t3craft.TalkChecks'
}

// No fixture needed, so `build` runs it everywhere.
tasks.named('check') { dependsOn 'uiCheck', 'worldCheck', 'talkCheck' }

tasks.register('firstRunCheck', JavaExec) {
	description = 'Zero setup: default thread choice, the one-line chat budget and auto-pairing with the local T3 against the fixture.'
	classpath = sourceSets.smoke.runtimeClasspath
	mainClass = 'dev.maxwellyoung.t3craft.FirstRunChecks'
	args = [project.findProperty('fixturePort') ?: '25680']
}

// Fixture-backed checks share one entry point in PR and tag builds.
tasks.register('verifyAll') {
	dependsOn 'build', 'officeCheck', 'usageBoardCheck', 'talkCheck', 'connectionCheck', 'featureCheck', 'reliabilityCheck', 'firstRunCheck'
}

dependencyLocking {
	lockAllConfigurations()
	// macOS-only Minecraft library; resolving it on Linux CI would violate the lock state.
	ignoredDependencies.add("ca.weblite:java-objc-bridge")
}

// Exercise smoke checks on the invoking JDK while compiling the mod with Java 25.
tasks.withType(JavaExec).configureEach {
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(JavaVersion.current().majorVersion)
	}
}

// MCP checks mutate fixture state and run separately from verifyAll.
tasks.register('mcpCheck', JavaExec) {
	description = 'Public MCP transport, OAuth, incremental history, visibility and per-leg fallback checks.'
	classpath = sourceSets.smoke.runtimeClasspath
	mainClass = 'dev.maxwellyoung.t3craft.McpChecks'
	args = [fixturePort()]
}

tasks.register('webProbe', JavaExec) {
	description = 'Opt-in, read-only: open the local T3 web app in the hidden Chrome and save a laptop and agent-card frame.'
	classpath = sourceSets.smoke.runtimeClasspath
	mainClass = 'dev.maxwellyoung.t3craft.WebProbe'
	args = [project.findProperty('profile') ?: 'run/config/t3craft/chrome', project.findProperty('out') ?: 'build/web-probe', project.findProperty('thread') ?: '']
}
