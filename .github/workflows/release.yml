name: release-jar

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Tag matches the mod version
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          echo "Tag: $GITHUB_REF_NAME; mod version: v$version"
          test "v$version" = "$GITHUB_REF_NAME"
  verify:
    needs: version
    uses: ./.github/workflows/build.yml
  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: t3craft-jar-java-25
          path: release
      - name: Publish verified jar and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release
        run: |
          sha256sum ./*.jar > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" ./*.jar SHA256SUMS.txt --verify-tag --generate-notes
